name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Các test trỏ cố định tới /opt/pw-browsers/chromium (môi trường phát triển) → trỏ về Chromium của Playwright.
      - run: sudo mkdir -p /opt/pw-browsers && sudo ln -sf "$(node -e "console.log(require('playwright').chromium.executablePath())")" /opt/pw-browsers/chromium
      - run: npm run build
      # config.html lưu bản base64 của dist: phải đồng bộ sau build để tránh phát hành mẫu cũ.
      - run: npm run build:config
      - run: npm run lint
      - run: npm test
      # Cảnh báo lỗ hổng thư viện (xlsx chưa có bản vá; jsPDF/autotable cần nâng major) — chưa chặn CI.
      - run: npm audit --omit=dev
        continue-on-error: true

  desktop-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Test Electron main bằng mock, không cần khởi chạy GUI.
      - run: node desktop-app/tests/test-template-refresh.js
      - run: node desktop-app/tests/test-source-validator.js

  desktop-windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node desktop-app/tests/test-template-refresh.js
      - run: node desktop-app/tests/test-source-validator.js

  desktop-installer:
    # Chỉ build bộ cài từ main sau khi build/test và Windows mock đều đạt;
    # không công bố một EXE lấy từ PR chưa được nghiệm thu.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, desktop-windows-tests]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build latest report for Desktop
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Package Windows installer
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ${{ secrets.HAK_WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.HAK_WINDOWS_CSC_PASSWORD }}
        run: |
          npm ci
          npm run dist
      - name: Audit Authenticode, SHA-256 and optional Defender scan
        shell: pwsh
        env:
          SIGNING_CERT_PRESENT: ${{ secrets.HAK_WINDOWS_CSC_LINK != '' }}
        run: |
          $requireSigned = $env:SIGNING_CERT_PRESENT -eq 'true'
          ./desktop-app/scripts/audit-installer.ps1 -ReleaseDir ./desktop-app/release -RequireSignature:$requireSigned
      - name: Record GitHub build provenance for the EXE
        uses: actions/attest@v4
        with:
          subject-path: desktop-app/release/*.exe
      - name: Upload Windows installer and security manifest
        uses: actions/upload-artifact@v4
        with:
          name: HAK-BAOCAONGAY-Windows-Setup
          path: |
            desktop-app/release/*.exe
            desktop-app/release/SHA256SUMS.txt
            desktop-app/release/INSTALLER_SECURITY.json
          if-no-files-found: error
          retention-days: 30
