name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # config.html lưu bản base64 của dist: phải đồng bộ sau build để tránh phát hành mẫu cũ.
      - run: npm run build:config
      - run: node scripts/verify-build.mjs
      - name: Check committed artifacts match the build
        run: git diff --exit-code -- config.html dist/index.html ../desktop-app/app/index.html
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run test:ui
      - run: npm audit --audit-level=high
      - name: Audit Electron and packaging dependencies
        working-directory: desktop-app
        run: npm audit --audit-level=high

  desktop-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Test Electron main bằng mock, không cần khởi chạy GUI.
      - run: node desktop-app/tests/test-template-refresh.js
      - run: node desktop-app/tests/test-source-validator.js

  desktop-windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node desktop-app/tests/test-template-refresh.js
      - run: node desktop-app/tests/test-source-validator.js
      - name: Smoke test installer audit on a signed Windows system executable
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'hak-audit-smoke'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item (Join-Path $env:WINDIR 'System32/cmd.exe') (Join-Path $testDir 'cmd.exe')
          ./desktop-app/scripts/audit-installer.ps1 -ReleaseDir $testDir -RequireSignature
          $result = Get-Content (Join-Path $testDir 'INSTALLER_SECURITY.json') -Raw | ConvertFrom-Json
          if ($result.installers.Count -ne 1 -or $result.installers[0].authenticode -ne 'Valid') {
            throw 'Security manifest smoke test failed'
          }

  desktop-upgrade-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop-app/package-lock.json
      - name: Build web template
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:config
          Copy-Item dist/index.html ../desktop-app/app/index.html -Force
          node scripts/verify-build.mjs
      - name: Prepare the temporary test directory
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'hak-license-qa'
          New-Item -ItemType Directory $fixtureDir | Out-Null
          "HAK_LICENSE_QA=1" >> $env:GITHUB_ENV
          "HAK_QA_LICENSE_DIR=$fixtureDir" >> $env:GITHUB_ENV
      - name: Package installer for Windows QA
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist -- --publish never
      - name: Fetch the published legacy installer
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 2
        run: |
          $oldDir = Join-Path $env:RUNNER_TEMP 'hak-original'
          gh release download installer-v1.0.0-2 --pattern '*.exe' --dir $oldDir
          if ($LASTEXITCODE) { throw 'Legacy installer download failed.' }
          $old = @(Get-ChildItem $oldDir -Filter '*.exe')
          $new = @(Get-ChildItem desktop-app/release -Filter '*.exe')
          if ($old.Count -ne 1 -or $new.Count -ne 1) { throw 'Expected exactly one old and one new installer.' }
          "HAK_QA_OLD=$($old[0].FullName)" >> $env:GITHUB_ENV
          "HAK_QA_NEW=$($new[0].FullName)" >> $env:GITHUB_ENV
      - name: Sign and verify the QA installer
        timeout-minutes: 2
        run: ./desktop-app/tests/sign-for-test.ps1 -Installer $env:HAK_QA_NEW
      - name: Install both versions and verify upgrade and restore
        timeout-minutes: 8
        run: |
          Write-Host "Published installer signature: $((Get-AuthenticodeSignature $env:HAK_QA_OLD).Status)"
          if ((Get-AuthenticodeSignature $env:HAK_QA_NEW).Status -ne 'Valid') { throw 'QA installer signature invalid.' }
          node app/tests/windows-installer-upgrade.mjs $env:HAK_QA_OLD $env:HAK_QA_NEW
      - name: Remove the QA signing certificate
        if: always()
        run: |
          if ($env:HAK_QA_CERT_THUMBPRINT) {
            Remove-Item "Cert:\LocalMachine\Root\$env:HAK_QA_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$env:HAK_QA_CERT_THUMBPRINT" -ErrorAction SilentlyContinue

          }
