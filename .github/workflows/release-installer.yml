name: Release installer

# Đóng bộ cài app desktop "Báo cáo ngày" (Windows) — chạy tay: tab Actions → "Release installer" → Run workflow.
# Kết quả được đăng lên mục Releases của repo (tải từng file trực tiếp) và nằm trong Artifacts của lần chạy: file Setup .exe, các phần .part (≤ 28 MB), GHEP_FILE.bat, HUONG_DAN_GHEP_FILE.txt.
on:
  workflow_dispatch:

permissions:
  contents: write   # tạo GitHub Release
  id-token: write
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop-app/package-lock.json

      # Bản web mới nhất (desktop-app/scripts/release.mjs chép app/dist/index.html vào app desktop)
      - name: Build web
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:config

      - name: Build Authenticode-signed installer
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ${{ secrets.HAK_WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.HAK_WINDOWS_CSC_PASSWORD }}
          HAK_REQUIRE_SIGNING: "1"
          HAK_LICENSE_PUBLIC_KEY: ${{ vars.HAK_LICENSE_PUBLIC_KEY }}
        run: |
          if (-not $env:HAK_LICENSE_PUBLIC_KEY) { throw 'Configure HAK_LICENSE_PUBLIC_KEY with the company issuer public key.' }
          if (-not $env:WIN_CSC_LINK) { throw 'Configure HAK_WINDOWS_CSC_LINK before publishing a signed installer.' }
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run release

      - name: Verify signature and record SHA-256
        run: |
          ./desktop-app/scripts/audit-installer.ps1 -ReleaseDir ./desktop-app/release -RequireSignature -RequireTimestamp
          $registration = Get-AuthenticodeSignature -LiteralPath ./desktop-app/release/registration/HAK-License.exe
          if ($registration.Status -ne 'Valid' -or -not $registration.TimeStamperCertificate) { throw 'Invalid signature on registration tool.' }

      - name: Record GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-path: desktop-app/release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BaoCaoNgay-installer
          path: |
            desktop-app/release/*.exe
            desktop-app/release/*.part
            desktop-app/release/GHEP_FILE.bat
            desktop-app/release/HUONG_DAN_GHEP_FILE.txt
            desktop-app/release/registration/HAK-License.exe
            desktop-app/release/SHA256SUMS.txt
            desktop-app/release/INSTALLER_SECURITY.json
          if-no-files-found: error
          retention-days: 30

      # Đăng lên Releases để tải trực tiếp từng file (không cần tải zip Artifacts).
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').version")
          TAG="installer-v${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" \
            desktop-app/release/*.exe desktop-app/release/*.part \
            desktop-app/release/GHEP_FILE.bat desktop-app/release/HUONG_DAN_GHEP_FILE.txt \
            desktop-app/release/SHA256SUMS.txt desktop-app/release/INSTALLER_SECURITY.json \
            desktop-app/release/registration/HAK-License.exe \
            --title "Bộ cài Báo cáo ngày ${VERSION} (lần ${{ github.run_number }})" \
            --notes "Bộ cài desktop Báo cáo ngày ${VERSION}, đóng từ commit ${{ github.sha }}, đã xác minh chữ ký Authenticode. Tải các file .part cùng GHEP_FILE.bat vào một thư mục, nhấp đúp GHEP_FILE.bat; hoặc tải thẳng file Setup .exe."
