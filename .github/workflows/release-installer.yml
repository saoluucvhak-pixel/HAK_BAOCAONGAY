name: Update the device approval guide in the 2.6.0 admin draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-admin:
    if: github.ref == 'refs/heads/codex/hak-correct-260-guide-asset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the HTML in the existing 2.6.0 admin draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=461142942
          tag=quan-tri-v2.6.0-16.1
          api="repos/$GITHUB_REPOSITORY/releases/$release"
          test "$(gh api "$api" --jq '.draft and .tag_name == "quan-tri-v2.6.0-16.1"')" = true
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$tag" --pattern HAK-CapPhep.html --dir "$work"
          printf '%s  %s\n' f7037acd95aba2fdd492e735970a9677581abb2c061dbb977b106f6a00cf21c1 "$work/HAK-CapPhep.html" | sha256sum -c -
          file=desktop-app/licensing/HAK-CapPhep.html
          grep -Fq 'Hướng dẫn cấp phép Báo cáo ngày cho từng máy' "$file"
          test "$(gh api "$api" --jq '.draft')" = true
          if ! gh release upload "$tag" "$file" --clobber; then
            gh release upload "$tag" "$work/HAK-CapPhep.html" --clobber
            exit 1
          fi
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          test "$(gh api "$api" --jq '.assets[] | select(.name=="HAK-CapPhep.html") | .digest')" = "sha256:$digest"
