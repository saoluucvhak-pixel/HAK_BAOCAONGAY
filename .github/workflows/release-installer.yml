name: Release installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Setup and keep the companion HTML in a separate draft
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop-app/package-lock.json

      - name: Build web
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:config

      - name: Build Windows Setup and matching admin HTML
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run release

      - name: Verify the installer and record SHA-256
        run: ./desktop-app/scripts/audit-installer.ps1 -ReleaseDir ./desktop-app/release

      - name: Record GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-path: desktop-app/release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BaoCaoNgay-installer
          path: |
            desktop-app/release/*.exe
            desktop-app/release/*.part
            desktop-app/release/GHEP_FILE.bat
            desktop-app/release/HUONG_DAN_GHEP_FILE.txt
            desktop-app/release/SHA256SUMS.txt
            desktop-app/release/INSTALLER_SECURITY.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Setup and save admin HTML as a draft
        if: inputs.publish && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').version")
          PAIR="v${VERSION}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "quan-tri-${PAIR}" desktop-app/release/HAK-CapPhep.html \
            --draft --target "$GITHUB_SHA" \
            --title "HAK quản trị nội bộ ${PAIR}" \
            --notes "HTML quản trị đi kèm bộ cài installer-${PAIR}. Giữ bản nháp này ở chế độ dành cho người có quyền ghi kho."
          gh release create "installer-${PAIR}" \
            desktop-app/release/*.exe desktop-app/release/*.part \
            desktop-app/release/GHEP_FILE.bat desktop-app/release/HUONG_DAN_GHEP_FILE.txt \
            desktop-app/release/SHA256SUMS.txt desktop-app/release/INSTALLER_SECURITY.json \
            --target "$GITHUB_SHA" --title "Bộ cài Báo cáo ngày ${PAIR}" \
            --notes "Bộ cài Windows x64 từ commit ${GITHUB_SHA}, có SHA-256 và kiểm tra nguồn gốc bản dựng. Bộ cài chưa ký Authenticode. Mỗi lần cài có mã yêu cầu mới. Quản trị viên dùng HTML đúng đợt phát hành để tạo phản hồi."
