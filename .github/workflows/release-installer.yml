name: Update admin HTML for 2.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-admin:
    if: github.ref == 'refs/heads/codex/hak-update-admin-230'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the compatible HTML to the existing admin draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=460717882
          tag=quan-tri-v2.3.0-11.1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release" --jq '.draft and .tag_name == "quan-tri-v2.3.0-11.1"')" = true
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          export HAK_ADMIN_PATCH_DIR="$work"
          gh release download "$tag" --pattern HAK-CapPhep.html --dir "$work"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir = process.env.HAK_ADMIN_PATCH_DIR;
          const original = readFileSync(dir + '/HAK-CapPhep.html', 'utf8');
          assert.equal(createHash('sha256').update(original).digest('hex'), '4ae50f05e5fb9170138dd99aad83b9bb1d1260a8df4e131a1181f6d720d24961');
          const pair = original.match(/^const seed = '([A-Za-z0-9+/]{43}=)';$/m);
          assert(pair, 'Missing installer pairing.');
          const template = readFileSync('desktop-app/licensing/HAK-CapPhep.html', 'utf8');
          assert.equal(template.split('__HAK_BUILD_SEED__').length, 2);
          writeFileSync(dir + '/HAK-CapPhep-NhieuCongTy.html', template.replace('__HAK_BUILD_SEED__', pair[1]));
          JS
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release" --jq '.draft')" = true
          gh release upload "$tag" "$work/HAK-CapPhep-NhieuCongTy.html"
