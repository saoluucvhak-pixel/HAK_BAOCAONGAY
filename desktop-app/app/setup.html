<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cấu hình công ty — Báo cáo ngày</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./company-setup-tokens.css">
<link rel="stylesheet" href="./company-setup.css">
<script src="./company-setup-theme.js"></script>
</head>
<body>
<!-- HAK_SETUP_BODY_START -->
<header class="topbar">
  <div class="topbar-inner">
    <strong>Hệ thống báo cáo</strong>
    <button class="btn" type="button" id="btnBack" hidden>← Quay lại báo cáo</button>
  </div>
</header>
<main class="wrap">
  <h1>Cấu hình công ty</h1>
  <p class="sub">Nhập tệp Excel chứa thông tin công ty và địa chỉ 5 nguồn Google Sheets.</p>
  <p id="currentCompany" class="company-line" aria-label="Công ty đang dùng"></p>
  <div class="card">
    <div class="file-box">
      <div class="file-info">
        <strong>Tệp cấu hình Excel</strong>
        <span id="fileName" aria-live="polite">Chưa chọn tệp .xlsx</span>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="btnTemplate">Tải mẫu Excel</button>
        <button class="btn" type="button" id="btnChooseFile" aria-describedby="fileName">Chọn tệp Excel</button>
        <input id="configFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      </div>
    </div>
    <ul id="sourceResults" aria-label="Kết quả kiểm tra nguồn"></ul>
    <p id="companySummary" class="company-line" aria-label="Công ty đã kiểm tra"></p>
    <div class="actions confirm-actions">
      <button class="btn" type="button" id="btnCheck" disabled>Kiểm tra 5 nguồn</button>
      <button class="btn primary" type="button" id="btnSave" disabled>Xác nhận lưu</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>
</main>
<!-- HAK_SETUP_BODY_END -->
<script src="./source-validator.js"></script>
<script src="./exceljs.min.js"></script>
<script src="./company-import.js"></script>
<script>
window.api.getConfig().then(current => window.HAKCompanyImport.mount({
  current, confirm: data => window.api.saveConfig(data), back: window.api.backToReport,
}));
</script>
</body>
</html>
