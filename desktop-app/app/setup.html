<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cấu hình công ty — Báo cáo ngày</title>
<style>
  :root{--ink:#1a2233;--sub:#5b6577;--line:#e2e6ee;--accent:#1f6feb;--err:#c0392b;--ok:#1a8a4a;--panel:#fff;--bg:#f4f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:32px 24px 60px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--sub);font-size:13.5px;line-height:1.5;margin:0 0 24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .card h2{font-size:14px;margin:0 0 14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
  label:first-of-type{margin-top:0}
  .hint{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
  input[type=text],input[type=url]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .req{color:var(--err)}
  button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:default}
  #msg{margin-top:14px;font-size:13.5px;min-height:18px}
  #msg.err{color:var(--err)}
  #msg.ok{color:var(--ok)}
  .source-status{font-size:12px;line-height:1.45;margin:5px 0 12px;white-space:pre-wrap;color:var(--sub)}
  .source-status.ok{color:var(--ok)}
  .source-status.err{color:var(--err)}
  #btnCheck{background:#e9f1ff;border:1px solid #b8d2ff;color:#185bb7;margin-bottom:10px}
  .safetyNote{font-size:12px;line-height:1.55;color:#64522a;background:#fff8e5;border:1px solid #f0e0ab;border-radius:8px;padding:10px 12px;margin-top:12px}
  .editNote{background:#eef4ff;border:1px solid #cfe0ff;border-radius:10px;padding:10px 14px;font-size:12.8px;color:#1a3a72;margin-bottom:16px;display:none}

  .company-line{font-size:13.5px;font-weight:600;white-space:nowrap;overflow-x:auto}
  .company-line:empty,#sourceResults:empty{display:none}
  #btnTemplate{margin:12px 0;background:#eef4ff;color:#174890}
  #btnCheck,#btnSave{margin-top:8px}
  #sourceResults{font-size:12.5px;padding-left:20px;margin:10px 0}
  #sourceResults .ok{color:#177443}
  #sourceResults .err,#msg.err{color:#a83228}
  #msg.ok{color:#177443}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cấu hình công ty</h1>
  <p class="sub">Nhập một file Excel (.xlsx) chứa thông tin công ty và 5 nguồn Google Sheets: Phiếu cân, DNTT, HDMB, Xuất hàng và Hồ sơ keo. Muốn đổi cấu hình, nhập file mới.</p>
  <p id="currentCompany" class="company-line" aria-label="Công ty đang dùng"></p>
  <div class="card">
    <label for="configFile">Nhập file cấu hình</label>
    <input id="configFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    <button type="button" id="btnTemplate">Tải mẫu Excel</button>
    <button type="button" id="btnCheck" disabled>Kiểm tra 5 nguồn Google Sheets</button>
    <ul id="sourceResults" aria-label="Kết quả kiểm tra nguồn"></ul>
    <p id="companySummary" class="company-line" aria-label="Công ty đã kiểm tra"></p>
    <button type="button" id="btnSave" disabled>Xác nhận lưu</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>
</div>
<script src="./source-validator.js"></script>
<script src="./exceljs.min.js"></script>
<script src="./company-import.js"></script>
<script>
window.api.getConfig().then(current => window.HAKCompanyImport.mount({
  current, confirm: data => window.api.saveConfig(data),
}));
</script>
</body>
</html>
