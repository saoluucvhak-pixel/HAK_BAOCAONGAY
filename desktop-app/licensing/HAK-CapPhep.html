<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAK · Quản trị giấy phép</title>
<style>
  :root { font: 16px/1.55 system-ui,sans-serif; color: #14252c; background: #f3f6f7; }
  body { margin: 0; padding: 30px 16px; }
  main { max-width: 760px; margin: auto; }
  h1 { font-size: 1.8rem; margin-bottom: .2rem; }
  h2 { font-size: 1.2rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .9rem; }
  section { background: #fff; border: 1px solid #d5e0e3; padding: 20px; margin-top: 18px; border-radius: 10px; }
  label { display: block; font-weight: 650; margin-bottom: .7rem; }
  input { display: block; box-sizing: border-box; margin-top: .25rem; width: 100%; padding: .55rem; border: 1px solid #99afb6; border-radius: 5px; font: inherit; }
  button { border: 0; border-radius: 5px; background: #005864; color: #fff; font: inherit; font-weight: 650; padding: .55rem .85rem; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  button.secondary { background: #e5f0f2; color: #17424a; margin: .8rem .4rem 0 0; }
  .status { margin: .8rem 0 0; }
  .error { color: #9f1e2c; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Quản trị giấy phép HAK</h1>
    <p>Dùng trên máy quản trị HAK. Công cụ chạy offline.</p>
  </header>
  <section aria-labelledby="create-title">
    <h2 id="create-title">Tạo khóa cấp phép</h2>
    <p>Chỉ tạo một lần cho đơn vị. Giữ khóa riêng và mật khẩu trong kho quản trị.</p>
    <form id="createForm">
      <label>Mật khẩu khóa riêng <input id="newPassword" type="password" autocomplete="new-password" required minlength="12" placeholder="Ít nhất 12 ký tự"></label>
      <label>Nhập lại mật khẩu <input id="repeatPassword" type="password" autocomplete="new-password" required minlength="12"></label>
      <button type="submit">Tạo khóa</button>
    </form>
    <div id="keyDownloads" hidden>
      <button class="secondary" id="downloadPublic" type="button">Tải public.jwk</button>
      <button class="secondary" id="downloadPrivate" type="button">Tải khóa riêng đã mã hóa</button>
    </div>
    <p id="createStatus" class="status" role="status"></p>
  </section>
  <section aria-labelledby="issue-title">
    <h2 id="issue-title">Cấp giấy phép cho máy đã duyệt</h2>
    <form id="issueForm">
      <label>File yêu cầu của máy HAK <input id="requestFile" type="file" accept=".hakreq" required></label>
      <label>Khóa riêng đã mã hóa <input id="privateFile" type="file" accept=".hakkey" required></label>
      <label>Mật khẩu khóa riêng <input id="issuePassword" type="password" autocomplete="off" required></label>
      <label>Mã tài sản <input id="asset" type="text" maxlength="128" placeholder="HAK-KT-023" required></label>
      <label>Ngày hết hạn theo giờ Việt Nam <input id="expiry" type="date" required></label>
      <button type="submit">Ký và tải giấy phép</button>
    </form>
    <p id="issueStatus" class="status" role="status"></p>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const product = 'com.hakgroup.baocaongay';
const keyFormat = 'hak-issuer-key-v1';
const iterations = 600000;
const encoder = new TextEncoder();
const rsa = { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' };
let generatedKeys;

function toBase64(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}
function fromBase64(text) {
  return Uint8Array.from(atob(text), (character) => character.charCodeAt(0));
}
function normalBase64(text, size) {
  if (typeof text !== 'string') return false;
  const bytes = fromBase64(text);
  return bytes.length === size && toBase64(bytes) === text;
}
async function passwordKey(password, salt) {
  const initial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, initial,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function readJson(input) {
  const file = input.files[0];
  if (!file || file.size > 16384) throw new Error('File chọn sai hoặc lớn hơn 16 KB.');
  return JSON.parse(await file.text());
}
function download(filename, value) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(value)], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function report(status, text, error = false) {
  status.textContent = text;
  status.classList.toggle('error', error);
}
function submit(form, status, action) {
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    report(status, 'Đang xử lý…');
    try {
      if (!crypto.subtle) throw new Error('Mở file bằng Chrome hoặc Edge đã cập nhật.');
      await action();
    } catch (error) {
      report(status, error.message, true);
    } finally {
      button.disabled = false;
    }
  });
}

submit($('createForm'), $('createStatus'), async () => {
  const password = $('newPassword').value;
  if (password !== $('repeatPassword').value) throw new Error('Hai ô mật khẩu chưa khớp.');
  const pair = await crypto.subtle.generateKey(
    { ...rsa, modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]) }, true, ['sign', 'verify']
  );
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await passwordKey(password, salt);
  const privateBytes = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
  let encrypted;
  try {
    encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, privateBytes);
  } finally {
    new Uint8Array(privateBytes).fill(0);
  }
  generatedKeys = {
    publicKey: await crypto.subtle.exportKey('jwk', pair.publicKey),
    privateKey: { format: keyFormat, salt: toBase64(salt), iv: toBase64(iv), encrypted: toBase64(encrypted) }
  };
  $('createForm').reset();
  $('keyDownloads').hidden = false;
  report($('createStatus'), 'Đã tạo khóa. Gửi public.jwk để đóng bộ cài. Giữ file khóa riêng trên máy quản trị HAK.');
});
$('downloadPublic').addEventListener('click', () => download('public.jwk', generatedKeys.publicKey));
$('downloadPrivate').addEventListener('click', () => download('HAK-KhoaRieng.hakkey', generatedKeys.privateKey));

submit($('issueForm'), $('issueStatus'), async () => {
  const request = await readJson($('requestFile'));
  if (request.product !== product || request.provider !== 'Microsoft Platform Crypto Provider' ||
      !normalBase64(request.device, 32)) throw new Error('File yêu cầu đăng ký TPM không hợp lệ.');
  const asset = $('asset').value.trim();
  const date = $('expiry').value;
  const issuedAt = Math.floor(Date.now() / 1000);
  const expiresAt = Math.floor(Date.parse(date + 'T23:59:59+07:00') / 1000);
  if (!asset || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(expiresAt) || expiresAt <= issuedAt)
    throw new Error('Cần mã tài sản và ngày hết hạn hợp lệ trong tương lai.');
  const stored = await readJson($('privateFile'));
  if (stored.format !== keyFormat || !normalBase64(stored.salt, 16) || !normalBase64(stored.iv, 12))
    throw new Error('File khóa riêng đã mã hóa không hợp lệ.');
  const key = await passwordKey($('issuePassword').value, fromBase64(stored.salt));
  $('issuePassword').value = '';
  let privateBytes;
  try {
    privateBytes = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromBase64(stored.iv) }, key, fromBase64(stored.encrypted)
    );
  } catch {
    throw new Error('Sai mật khẩu hoặc file khóa riêng đã bị thay đổi.');
  }
  let issuer;
  try {
    issuer = await crypto.subtle.importKey('pkcs8', privateBytes, rsa, false, ['sign']);
  } finally {
    new Uint8Array(privateBytes).fill(0);
  }
  const id = crypto.randomUUID();
  const body = encoder.encode(JSON.stringify({ product, version: 1, id, asset, device: request.device, issuedAt, expiresAt }));
  const signature = await crypto.subtle.sign(rsa, issuer, body);
  download('HAK-GiayPhep.haklic', { body: toBase64(body), signature: toBase64(signature) });
  report($('issueStatus'), 'Đã cấp giấy phép ' + id + ' cho ' + asset + ', hết hạn ' + date + '.');
});
</script>
</body>
</html>
