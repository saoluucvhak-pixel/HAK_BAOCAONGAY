<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAK · Quản trị giấy phép</title>
<style>
  :root { font: 16px/1.55 system-ui,sans-serif; color: #14252c; background: #f3f6f7; }
  body { margin: 0; padding: 30px 16px; }
  main { max-width: 760px; margin: auto; }
  h1 { font-size: 1.8rem; margin-bottom: .2rem; }
  h2 { font-size: 1.2rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .9rem; }
  section { background: #fff; border: 1px solid #d5e0e3; padding: 20px; margin-top: 18px; border-radius: 10px; }
  label { display: block; font-weight: 650; margin-bottom: .7rem; }
  input, textarea { display: block; box-sizing: border-box; margin-top: .25rem; width: 100%; padding: .55rem; border: 1px solid #99afb6; border-radius: 5px; font: inherit; }
  details { margin-bottom: .85rem; }
  textarea { overflow-wrap: anywhere; resize: vertical; }
  button { border: 0; border-radius: 5px; background: #005864; color: #fff; font: inherit; font-weight: 650; padding: .55rem .85rem; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  button.secondary { background: #e5f0f2; color: #17424a; margin: .8rem .4rem 0 0; }
  .status { margin: .8rem 0 0; }
  .error { color: #9f1e2c; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Quản trị giấy phép HAK</h1>
    <p>Dùng trên máy quản trị HAK. Công cụ chạy offline.</p>
  </header>
  <section aria-labelledby="issue-title">
    <h2 id="issue-title">Tạo phản hồi cho máy cần cài</h2>
    <form id="issueForm">
      <label>Mã yêu cầu từ máy cần cài <input id="requestCode" type="text" spellcheck="false" autocomplete="off" inputmode="numeric" placeholder="12345678" maxlength="16"></label>
      <details id="companyDetails">
        <summary>Thông tin công ty và nguồn Google Sheets</summary>
        <label>Ngày hết hạn của file phản hồi <input id="expiry" type="date"></label>
        <label>Tên công ty <input id="TenCty" maxlength="200"></label>
        <label>Địa chỉ công ty <input id="DiaChi" maxlength="300"></label>
        <label>Mã số thuế <input id="MST" maxlength="40"></label>
        <label>Số điện thoại <input id="SDT" maxlength="40"></label>
        <label>Địa chỉ thu mua <input id="DiaChiThuMua" maxlength="300"></label>
        <label>Mã HS <input id="MaHS" maxlength="32"></label>
        <label>Nhà máy <input id="NhaMay" maxlength="80"></label>
        <label>Link CSV phiếu cân <input id="PhieuCan" maxlength="2000" inputmode="url"></label>
        <label>Link CSV đề nghị thanh toán <input id="DNTT" maxlength="2000" inputmode="url"></label>
        <label>Link CSV hợp đồng NCC (tùy chọn) <input id="HDNCC" maxlength="2000" inputmode="url"></label>
        <label>Link CSV hồ sơ keo (tùy chọn) <input id="Hosokeo" maxlength="2000" inputmode="url"></label>
      </details>
      <button type="submit" value="code">Tạo mã trả lời</button>
      <button class="secondary" type="submit" value="kit">Tạo file cài đặt HAK</button>
      <details>
        <summary>Dùng lại cấu hình khi cài lại</summary>
        <label>File cài đặt HAK cũ <input id="previousSetup" type="file" accept=".haksetup"></label>
        <button class="secondary" type="submit" value="restore" formnovalidate>Nạp cấu hình từ file cũ</button>
        <p>Sau khi nạp, kiểm tra cấu hình, dán mã yêu cầu mới và bấm Tạo file cài đặt HAK.</p>
      </details>
    </form>
    <div id="replyPanel" hidden>
      <label>Mã trả lời <input id="replyCode" readonly inputmode="numeric"></label>
      <button class="secondary" id="copyReply" type="button">Sao chép mã trả lời</button>
    </div>
    <p id="issueStatus" class="status" role="status"></p>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const product = 'com.hakgroup.baocaongay';
const seed = '__HAK_BUILD_SEED__';
const companyFields = ['TenCty', 'DiaChi', 'MST', 'SDT', 'DiaChiThuMua', 'MaHS', 'NhaMay', 'PhieuCan', 'DNTT', 'HDNCC', 'Hosokeo'];
const encoder = new TextEncoder();
const hmac = { name: 'HMAC', hash: 'SHA-256' };
let macKey;
$('expiry').value = new Date(Date.now() + 90 * 86400000 + 7 * 3600000).toISOString().slice(0, 10);

function toBase64(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}
function fromBase64(text) {
  return Uint8Array.from(atob(text), (character) => character.charCodeAt(0));
}
async function mac(domain, bytes) {
  if (!/^[A-Za-z0-9+/]{43}=$/.test(seed))
    throw new Error('Mở HTML quản trị đi kèm bộ cài đã đóng gói.');
  macKey ||= crypto.subtle.importKey('raw', fromBase64(seed), hmac, false, ['sign', 'verify']);
  const prefix = encoder.encode(product + '\n' + domain + '\n');
  const message = new Uint8Array(prefix.length + bytes.length);
  message.set(prefix);
  message.set(bytes, prefix.length);
  return { key: await macKey, message };
}
async function sign(domain, bytes) {
  const { key, message } = await mac(domain, bytes);
  return new Uint8Array(await crypto.subtle.sign(hmac.name, key, message));
}
function download(filename, value) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(value)], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function report(status, text, error = false) {
  status.textContent = text;
  status.classList.toggle('error', error);
}

function validateCompanyProfile(company) {
  for (const field of companyFields) {
    if (typeof company[field] !== 'string' || company[field].length > $(field).maxLength)
      throw new Error('Thông tin công ty trong cấu hình không hợp lệ.');
  }
  if (!company.TenCty) throw new Error('Nhập tên công ty trước khi tạo file cài đặt HAK.');
  const required = ['PhieuCan', 'DNTT'];
  for (const field of [...required, 'HDNCC', 'Hosokeo']) {
    const address = company[field];
    if (!address && !required.includes(field)) continue;
    let url;
    try { url = new URL(address); } catch { throw new Error('Nhập liên kết Google Sheets CSV cho ' + $(field).parentElement.firstChild.textContent.trim() + '.'); }
    const published = /^\/spreadsheets\/d\/e\/[^/]+\/pub\/?$/.test(url.pathname) && url.searchParams.get('output') === 'csv';
    const exported = /^\/spreadsheets\/d\/[^/]+\/export\/?$/.test(url.pathname) && url.searchParams.get('format') === 'csv';
    if (url.origin !== 'https://docs.google.com' || url.username || url.password ||
        /['"`<>\\\r\n]/.test(address) || (!published && !exported))
      throw new Error('Chỉ dùng liên kết Google Sheets đã xuất CSV.');
  }
}

async function restoreCompanyProfile() {
  let envelope, body;
  try {
    if (!$('previousSetup').files.length) throw new Error();
    const file = $('previousSetup').files[0];
    if (file.size > 16384) throw new Error();
    envelope = JSON.parse(await file.text());
    if (typeof envelope.body !== 'string' || typeof envelope.signature !== 'string') throw new Error();
    body = fromBase64(envelope.body);
  } catch {
    throw new Error('Chọn file cài đặt HAK cũ (.haksetup) hợp lệ.');
  }

  const { key, message } = await mac('setup-v1', body);
  if (!(await crypto.subtle.verify(hmac.name, key, fromBase64(envelope.signature), message)))
    throw new Error('File cũ thuộc bộ cài khác hoặc đã bị sửa.');
  let previous;
  try {
    previous = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(body));
  } catch {
    throw new Error('Nội dung file cài đặt HAK cũ không hợp lệ.');
  }
  if (previous?.product !== product || previous.version !== 2 ||
      !previous.company || typeof previous.company !== 'object' || Array.isArray(previous.company))
    throw new Error('File cũ thiếu cấu hình công ty của Báo cáo ngày HAK.');

  const company = Object.fromEntries(companyFields.map((field) => [field, previous.company[field] ?? '']));
  validateCompanyProfile(company);
  for (const field of companyFields) $(field).value = company[field];
  $('previousSetup').value = '';
  $('companyDetails').open = true;
  report($('issueStatus'), 'Đã nạp cấu hình cũ. Kiểm tra thông tin rồi tạo file bằng mã yêu cầu mới.');
}

$('issueForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = $('issueStatus');
  const buttons = [...event.currentTarget.querySelectorAll('button[type="submit"]')];
  buttons.forEach((button) => { button.disabled = true; });
  $('replyPanel').hidden = true;
  $('replyCode').value = '';
  try {
    if (!crypto.subtle) throw new Error('Mở công cụ bằng Chrome hoặc Edge đã cập nhật.');
    const mode = event.submitter?.value;
    if (mode === 'restore') {
      await restoreCompanyProfile();
      return;
    }

    const request = $('requestCode').value.replace(/\s+/g, '');
    if (!/^[0-9]{8}$/.test(request)) throw new Error('Nhập đủ 8 chữ số trên bộ cài.');
    if (mode !== 'kit') {
      const digest = await sign('code-v1', encoder.encode(request));
      let number = 0;
      for (const byte of digest.subarray(0, 6)) number = number * 256 + byte;
      $('replyCode').value = String(number % 1000000000000).padStart(12, '0');
      $('replyPanel').hidden = false;
      report(status, 'Gửi mã trả lời về máy đang cài.');
      return;
    }

    const issuedAt = Math.floor(Date.now() / 1000);
    const expiresAt = Math.floor(Date.parse($('expiry').value + 'T23:59:59+07:00') / 1000);
    if (!Number.isFinite(expiresAt) || expiresAt <= issuedAt)
      throw new Error('Ngày hết hạn phải ở trong tương lai.');
    const company = Object.fromEntries(companyFields.map((field) => [field, $(field).value.trim()]));
    validateCompanyProfile(company);
    const body = encoder.encode(JSON.stringify({ product, version: 2, device: request, issuedAt, expiresAt, company }));
    const kit = { body: toBase64(body), signature: toBase64(await sign('setup-v1', body)) };
    if (encoder.encode(JSON.stringify(kit)).length > 16384)
      throw new Error('File cài đặt vượt quá 16 KB. Hãy rút gọn thông tin trước khi tạo lại.');
    download('HAK-CaiDat.haksetup', kit);
    report(status, 'Gửi file HAK-CaiDat.haksetup về máy đang cài.');
  } catch (error) {
    report(status, error.message, true);
  } finally {
    buttons.forEach((button) => { button.disabled = false; });
  }
});
$('copyReply').addEventListener('click', async () => {
  const reply = $('replyCode');
  try {
    await navigator.clipboard.writeText(reply.value);
    report($('issueStatus'), 'Đã sao chép mã trả lời.');
  } catch {
    reply.focus();
    reply.select();
    report($('issueStatus'), 'Bấm Ctrl+C để sao chép mã trả lời.');
  }
});
</script>
</body>
</html>
